services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--entrypoints.panel.address=:15672"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "127.0.0.1:8443:443"
      - "15672:15672"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - wg-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Traefik Dashboard (optional, remove if not needed)
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-}"
      # 3x-ui panel (labels here because 3x-ui uses network_mode:host, invisible to Docker provider)
      - "traefik.http.routers.3xui.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.3xui.entrypoints=panel"
      - "traefik.http.routers.3xui.tls.certresolver=letsencrypt"
      - "traefik.http.services.3xui.loadbalancer.server.url=http://host.docker.internal:2053"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    hostname: wg-easy
    environment:
      - PORT=51821
      - INSECURE=true

      # Initial Setup (unattended installation)
      - INIT_ENABLED=${INIT_ENABLED:-true}
      - INIT_USERNAME=${INIT_USERNAME:-admin}
      - INIT_PASSWORD=${INIT_PASSWORD:?INIT_PASSWORD is required}
      - INIT_HOST=${DOMAIN:?DOMAIN is required}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${INIT_DNS:-1.1.1.1, 8.8.8.8}
      - INIT_IPV4_CIDR=${INIT_IPV4_CIDR:-10.8.0.0/24}
      - INIT_IPV6_CIDR=${INIT_IPV6_CIDR:-fdcc:ad94:bacf:61a3::/64}
      - INIT_ALLOWED_IPS=${INIT_ALLOWED_IPS:-0.0.0.0/0, ::/0}

      - DISABLE_IPV6=${DISABLE_IPV6:-false}
    volumes:
      - wg_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped
    networks:
      wg-network:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg-easy.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.routers.wg-easy.tls.certresolver=letsencrypt"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"

  sni-router:
    image: nginx:alpine
    container_name: sni-router
    network_mode: host
    volumes:
      - ./sni-router.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3xui
    volumes:
      - xui_db:/etc/x-ui/
      - xui_cert:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    network_mode: host
    restart: unless-stopped

volumes:
  wg_data:
    name: wg-easy_data
  traefik_certs:
    name: traefik_certs
  xui_db:
    name: 3xui_db
  xui_cert:
    name: 3xui_cert

networks:
  wg-network:
    name: wg-easy-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
