services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - wg-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Traefik Dashboard (optional, remove if not needed)
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-}"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    hostname: wg-easy
    environment:
      - PORT=51821
      - INSECURE=true

      # Initial Setup (unattended installation)
      - INIT_ENABLED=${INIT_ENABLED:-true}
      - INIT_USERNAME=${INIT_USERNAME:-admin}
      - INIT_PASSWORD=${INIT_PASSWORD:?INIT_PASSWORD is required}
      - INIT_HOST=${DOMAIN:?DOMAIN is required}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${INIT_DNS:-1.1.1.1, 8.8.8.8}
      - INIT_IPV4_CIDR=${INIT_IPV4_CIDR:-10.8.0.0/24}
      - INIT_IPV6_CIDR=${INIT_IPV6_CIDR:-fdcc:ad94:bacf:61a3::/64}
      - INIT_ALLOWED_IPS=${INIT_ALLOWED_IPS:-0.0.0.0/0, ::/0}

      - DISABLE_IPV6=${DISABLE_IPV6:-false}
    volumes:
      - wg_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped
    networks:
      wg-network:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg-easy.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.routers.wg-easy.tls.certresolver=letsencrypt"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"

volumes:
  wg_data:
    name: wg-easy_data
  traefik_certs:
    name: traefik_certs

networks:
  wg-network:
    name: wg-easy-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
